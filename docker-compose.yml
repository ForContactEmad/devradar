# ═════════════════════════════════════════════════════════════════════════════
# DevRadar — development stack
#
#   cp .env.example .env     # then set the three passwords it names
#   docker compose up        # that is all
#
# Seven services, each because the architecture needs it:
#
#   postgres          the serving store and the ledger
#   redis             queue and cache
#   api               the HTTP read path
#   worker            free pipeline stages, parallel
#   worker-ingestion  SEPARATE, because it must run exactly one at a time --
#                     two concurrent collection runs mean duplicate PAID
#                     fetches, and the provider's deduplication is documented
#                     as a soft guarantee
#   scheduler         fires each stage on its own cadence
#   frontend          the dashboard
#
# NO NGINX IN DEVELOPMENT. Nuxt and `artisan serve` both listen directly, so a
# reverse proxy would be a service that exists only to be configured. It is
# defined under the `production` profile, where TLS termination and routing
# actually need one, and does not start otherwise.
# ═════════════════════════════════════════════════════════════════════════════

name: devradar

# ─────────────────────────────────────────────────────────────────────────────
# Shared backend definition.
#
# api, worker, worker-ingestion and scheduler run the SAME image and differ
# only in command. Anchoring it here means a change to the build or the
# environment cannot be applied to three services and forgotten on the fourth.
# ─────────────────────────────────────────────────────────────────────────────
x-backend: &backend
  build:
    context: ./backend
    target: dev
  env_file: [.env]
  environment:
    DB_HOST: postgres
    DB_PORT: "5432"
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
  volumes:
    - ./backend:/app
    # NO named volume for vendor.
    #
    # A named volume here was masking the host's vendor directory rather than
    # protecting it: Docker fills such a volume from the image ONCE, at
    # creation, and never again. So once the host copy and the volume diverged
    # -- which happened the first time an rsync --delete removed
    # backend/vendor -- no rebuild could repair it, and every backend
    # container restarted forever on a missing autoload.php.
    #
    # Local development installs dependencies on the host:
    #   docker run --rm -v "$PWD":/app -w /app composer:2 install
    # and the bind mount carries them in. One source of truth.
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
  networks: [devradar]
  restart: unless-stopped

services:

  # ───────────────────────────────────────────────────────────── data stores
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devradar}
      POSTGRES_USER: ${POSTGRES_USER:-devradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # Loopback only. Publishing on every interface put an unauthenticated
      # database on any host with a public IP.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TWO CHECKS, because pg_isready alone is not enough.
      #
      # Verified by running it: `pg_isready -d totally_missing` still reports
      # "accepting connections". It answers whether the SERVER is up and never
      # connects to the named database, so on first boot it goes healthy while
      # the application database is still being created — and every dependent
      # container starts against a database that does not exist yet.
      #
      # The `select 1` is what actually proves the role can connect to the
      # database the app will use. It fails on a missing database or role,
      # which is the failure this needs to catch.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB && psql -U $$POSTGRES_USER -d $$POSTGRES_DB -tAc 'select 1' > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [devradar]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Redis holds the queue. An unauthenticated instance means anyone who can
    # reach it can write job payloads, which a worker then deserialises.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - --save
      - "60"
      - "1"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      # Authenticated, or the check reports healthy while every real client is
      # rejected for missing the password.
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    networks: [devradar]
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────── application
  api:
    <<: *backend
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      # Liveness, not readiness. A database blip must not mark every API
      # container unhealthy and trigger a restart that prolongs the outage.
      test: ["CMD-SHELL", "php -r 'exit(@file_get_contents(\"http://127.0.0.1:8000/api/v1/health\") ? 0 : 1);'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    <<: *backend
    # Free stages: normalize, deduplicate, filter, score. Retried freely
    # because re-running them costs CPU and nothing else.
    command: php artisan queue:work redis --queue=processing --tries=3 --backoff=10 --max-time=3600
    healthcheck:
      # Asks whether this process can still reach Redis, which is the only
      # thing a queue worker needs to do its job. `queue:work` has no port to
      # poll, so there is nothing else to ask.
      test: ["CMD-SHELL", "php artisan queue:monitor redis:processing > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker-ingestion:
    <<: *backend
    # EXACTLY ONE WORKER, ONE JOB AT A TIME. This is the only stage that
    # spends money per item; two concurrent runs buy the same posts twice.
    # `--max-jobs=1` makes the process exit after each job and `restart`
    # brings it back, which is a cruder but far more reliable serialisation
    # than trusting a lock.
    command: php artisan queue:work redis --queue=ingestion --tries=1 --max-jobs=1
    deploy:
      replicas: 1
    healthcheck:
      test: ["CMD-SHELL", "php artisan queue:monitor redis:ingestion > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  scheduler:
    <<: *backend
    # schedule:work is a long-running loop, so no host crontab is needed and
    # the schedule travels with the code.
    command: php artisan schedule:work
    healthcheck:
      # `schedule:list` exercises config loading and the route/console
      # bootstrap. If that fails the scheduler is running but firing nothing,
      # which is the failure worth catching -- a silent scheduler looks fine.
      test: ["CMD-SHELL", "php artisan schedule:list > /dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      # Reached from the BROWSER, not from inside the network, so it must be a
      # host-visible address. `http://api:8000` would resolve only between
      # containers and fail in the user's tab.
      NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      # As with vendor: keeps the image's node_modules from being masked by
      # the bind mount.
      - frontend-modules:/app/node_modules
    depends_on:
      api: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks: [devradar]
    restart: unless-stopped

  # ─────────────────────────────────────────────────────── production profile
  nginx:
    # Starts only with `--profile production`. In development it would be a
    # service whose entire job is to forward to two servers that already
    # listen on published ports.
    profiles: [production]
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/devradar.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api: {condition: service_healthy}
      frontend: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks: [devradar]
    restart: unless-stopped

# ─────────────────────────────────────────────────────────────────────────────
networks:
  devradar:
    driver: bridge
    # An explicit network rather than the implicit default, so service DNS
    # names are predictable and nothing on the host's default bridge can reach
    # these containers.

volumes:
  postgres-data:
  redis-data:
  frontend-modules:
