# Headers every proxied location needs.
#
# X-Forwarded-For matters more than it looks: the API rate-limits per IP, and
# without it every request keys to the proxy's address and the limit becomes
# global — a denial of service rather than a protection against one. Laravel
# must also trust the proxy for this to take effect.

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Connection        "";

proxy_connect_timeout 5s;
proxy_send_timeout    30s;
proxy_read_timeout    30s;
