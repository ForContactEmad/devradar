# DevRadar reverse proxy — production profile only.
#
# Two jobs: put one origin in front of both services so the browser makes no
# cross-origin requests, and be the single place TLS is terminated.
#
# TLS is NOT configured here. Terminating it correctly needs real certificates
# and a renewal mechanism, and a self-signed placeholder in a repository is
# how a deployment ends up serving one. Put this behind a load balancer or add
# a certificate mount; the routing below is what belongs in the image.

upstream devradar_api      { server api:8000;      keepalive 16; }
upstream devradar_frontend { server frontend:3000; keepalive 16; }

server {
    listen 80;
    server_name _;

    # Do not advertise the version to anyone scanning.
    server_tokens off;

    client_max_body_size 1m;

    # The proxy's own liveness, answered without touching an upstream, so a
    # backend outage does not make the proxy look dead too.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Health probes are not interesting and would otherwise dominate the log.
    location = /api/v1/health {
        access_log off;
        proxy_pass http://devradar_api;
        include /etc/nginx/conf.d/proxy_headers.conf;
    }

    location /api/ {
        proxy_pass http://devradar_api;
        include /etc/nginx/conf.d/proxy_headers.conf;
    }

    # Everything else is the dashboard, which is server-rendered, so this must
    # proxy rather than serve static files.
    location / {
        proxy_pass http://devradar_frontend;
        include /etc/nginx/conf.d/proxy_headers.conf;
    }
}
